name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BobTools/BobTools.csproj

      - name: Publish
        run: >
          dotnet publish BobTools/BobTools.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/BobTools

      - name: Zip artifact
        run: Compress-Archive -Path publish/BobTools/* -DestinationPath publish/BobTools-win-x64.zip

      # ── Nightly: upload artifact (retained 7 days) ──────────────────────────
      - name: Upload nightly artifact
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: BobTools-nightly-win-x64
          path: publish/BobTools-win-x64.zip
          retention-days: 7

      # ── Tagged release: create GitHub Release with zip attached ─────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BobTools ${{ github.ref_name }}
          body: |
            ## BobTools ${{ github.ref_name }}

            ### Installation
            1. Download `BobTools-win-x64.zip`
            2. Extract to a folder of your choice
            3. Run `BobTools.exe`

            No .NET installation required.
          generate_release_notes: true
          files: publish/BobTools-win-x64.zip
