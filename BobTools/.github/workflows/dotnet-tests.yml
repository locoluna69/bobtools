name: dotnet-tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BobTools.sln

      - name: Test
        run: dotnet test BobTools.Tests/BobTools.Tests.csproj --configuration Release --no-restore